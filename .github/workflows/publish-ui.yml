name: Publish @zouriel/ui

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.45.2)
        required: true
        type: string

concurrency:
  group: publish-ui-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require dispatch from main and validate version
        env:
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx ng build ui
      - run: npx ng test ui --watch=false
      - name: Verify Angular package version matches release
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          node -e 'const v = require("./dist/ui/package.json").version; if (`v${v}` !== process.env.RELEASE_TAG) { console.error(`Tag ${process.env.RELEASE_TAG} does not match package v${v}`); process.exit(1); }'
      - uses: actions/upload-artifact@v4
        with:
          name: ui-package
          path: dist/ui
          if-no-files-found: error
          retention-days: 1
      - name: Check out the Flutter twin
        run: git clone --depth 1 https://github.com/Zouriel/flutter-ui-library.git flutter-ui-library
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: 3.47.7
          channel: stable
      - name: Verify Flutter version matches release
        env:
          RELEASE_TAG: ${{ inputs.version }}
        working-directory: flutter-ui-library
        run: grep -Eq "^version: ${RELEASE_TAG#v}$" packages/zouriel_ui/pubspec.yaml
      - run: flutter pub get
        working-directory: flutter-ui-library
      - run: flutter analyze packages/zouriel_ui
        working-directory: flutter-ui-library
      - run: flutter test packages/zouriel_ui/test
        working-directory: flutter-ui-library

  create-tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          git tag -- "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

  publish:
    needs: [validate, create-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@zouriel'
      - uses: actions/download-artifact@v4
        with:
          name: ui-package
          path: dist/ui
      - name: Publish GitHub package
        run: npm publish
        working-directory: dist/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
